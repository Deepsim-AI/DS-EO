# ============================================================
# DS-EO Dispatcher — Gateway Entry Point Bindings (Generic)
# Runtime-agnostic. Adapt match rules per platform:
#   OpenClaw: channel="webchat", peer.kind="command"
#   DSH:      map to DSH hook names/slots
#   Generic:  agentId + role mapping is portable across platforms
# ============================================================
description: >
  Minimal gateway bindings for DS-EO entry points only.
  PM receives all inbound requests and dispatches internally via dispatcher engine.

# --- Entry Point Bindings ---
bindings:
  # /eo task → PM starts a new task (G0)
  - agentId: "pm"
    match:
      channel: "webchat"
      peer:
        kind: "command"
        id: "/eo.task"

  # /eo approve → CTO handles G1 plan approval
  - agentId: "cto"
    match:
      channel: "webchat"
      peer:
        kind: "command"
        id: "/eo.approve"

  # /eo review → Reviewer handles G3 review trigger
  - agentId: "reviewer"
    match:
      channel: "webchat"
      peer:
        kind: "command"
        id: "/eo.review"

# --- Notes ---
notes:
  application: >
    These bindings go into the `bindings` array at the root level of
    ~/.openclaw/openclaw.json (or OPENCLAW_CONFIG_PATH). Do NOT merge
    them into agents.list or any other config section.

  example_openclaw_json: |
    {
      "agents": { ... },
      "bindings": [
        {
          "agentId": "pm",
          "match": {
            "channel": "webchat",
            "peer": { "kind": "command", "id": "/eo.task" }
          }
        },
        {
          "agentId": "cto",
          "match": {
            "channel": "webchat",
            "peer": { "kind": "command", "id": "/eo.approve" }
          }
        },
        {
          "agentId": "reviewer",
          "match": {
            "channel": "webchat",
            "peer": { "kind": "command", "id": "/eo.review" }
          }
        }
      ]
    }

  gateway_update_command: >
    After merging, restart the gateway:
    openclaw gateway restart
    
    Verify bindings are active:
    openclaw agents list --bindings
